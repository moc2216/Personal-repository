# encoding: utf-8
# 蓝色遐想 / Blue Reverie，亮暗随系统切换。
# 来源：hunter-ji/blue-reverie-rime-theme，MIT，Copyright (c) 2025 Hunter Ji。
# 本项目调整补全提示对比度、规范参数名称，并加入共用的默认英文场景。
patch:
  style:
    color_scheme: blue_reverie
    color_scheme_dark: blue_reverie_dark
    status_message_type: mix
    candidate_format: "[label]. [candidate] [comment]"
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false
    translucency: true
    mutual_exclusive: false
    memorize_size: true
    show_paging: false
    alpha: 1.0
    candidate_list_layout: linear
    corner_radius: 12
    hilited_corner_radius: 10
    border_height: 0
    border_width: 6
    line_spacing: 5
    spacing: 8
    shadow_size: 6
    font_face: PingFangSC-Regular
    font_point: 16

  preset_color_schemes:
    blue_reverie:
      name: 蓝色遐想 / Blue Reverie
      author: HunterJi
      color_space: srgb
      back_color: 0xFFFFFF
      hilited_back_color: 0x252320
      hilited_candidate_back_color: 0xFF7A00
      text_color: 0xD8000000
      hilited_text_color: 0xDEDDDD
      candidate_text_color: 0x5E5E5E
      hilited_candidate_text_color: 0xFFFFFF
      label_color: 0x888785
      hilited_candidate_label_color: 0xFFFFFF
      comment_text_color: 0x707070
      hilited_comment_text_color: 0xFFFFFF

    blue_reverie_dark:
      name: 蓝色遐想-暗黑 / Blue Reverie Dark
      author: HunterJi
      color_space: srgb
      back_color: 0x3F000000
      hilited_back_color: 0x252320
      hilited_candidate_back_color: 0xFF7A00
      text_color: 0xD8000000
      hilited_text_color: 0xDEDDDD
      candidate_text_color: 0xFFFFFF
      hilited_candidate_text_color: 0xFFFFFF
      label_color: 0xEBEBEB
      hilited_candidate_label_color: 0xFFFFFF
      comment_text_color: 0xDEDDDD
      hilited_comment_text_color: 0xFFFFFF

  app_options:
    com.apple.Terminal:
      ascii_mode: true
    org.electerm.electerm:
      ascii_mode: true
    com.jetbrains.pycharm:
      ascii_mode: true
    com.apple.SecurityAgent:
      ascii_mode: true
    com.apple.authorizationhost:
      ascii_mode: true
