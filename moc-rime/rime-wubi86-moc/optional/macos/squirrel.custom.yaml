# Squirrel（鼠须管）前端外观自定义
# encoding: utf-8
# 玫枫 Roseo Maple 皮肤（亮/暗随系统切换）+ 指定程序默认英文模式。

patch:
  style:
    color_scheme: roseo_maple
    color_scheme_dark: roseo_maple_dark
  preset_color_schemes:
    roseo_maple:
      name: 玫枫 / Roseo Maple
      candidate_format: "[label]. [candidate] [comment]"
      candidate_list_layout: linear
      text_orientation: horizontal
      status_message_type: mix
      memorize_size: true

      alpha: 1.0
      border_height: 0
      border_width: 0
      border_color: 0xffffff
      back_color: 0xF4F4F6
      corner_radius: 5

      font_point: 18
      line_spacing: 5
      base_offset: 0
      preedit_back_color: 0x364572

      hilited_corner_radius: 5
      hilited_candidate_text_color: 0x4F11FA
      hilited_candidate_back_color: 0xEDEDF9
      hilited_candidate_label_color: 0x884F11FA

      label_font_face: PingFang SC
      label_font_point: 17
      label_color: 0xaaaaaa

      candidate_text_color: 0x222222
      candidate_font_face: PingFang SC
      candidate_font_point: 16

      comment_font_face: PingFang SC
      comment_font_point: 16
      comment_text_color: 0x5AC461

      inline_preedit: true
      spacing: 5
      hilited_text_color: 0x8E8E93
      hilited_back_color: 0xEFEFF4

    roseo_maple_dark:
      name: 玫枫-暗黑 / Roseo Maple Dark
      candidate_format: "[label]. [candidate] [comment]"
      candidate_list_layout: linear
      text_orientation: horizontal
      status_message_type: mix
      memorize_size: true

      alpha: 1.0
      border_height: 1
      border_width: 1
      border_color: 0x444444
      back_color: 0x333333
      corner_radius: 5

      font_point: 18
      line_spacing: 5
      base_offset: 0
      preedit_back_color: 0x364572

      hilited_corner_radius: 5
      hilited_candidate_text_color: 0xffffff
      hilited_candidate_back_color: 0x00ffffff
      hilited_candidate_label_color: 0x5AC461

      label_font_face: PingFang SC
      label_font_point: 17
      label_color: 0x77ffffff

      candidate_text_color: 0x99ffffff
      candidate_font_face: PingFang SC
      candidate_font_point: 16

      comment_font_face: PingFang SC
      comment_font_point: 16
      comment_text_color: 0x5AC461

      inline_preedit: true
      spacing: 5
      hilited_text_color: 0x8E8E93
      hilited_back_color: 0xEFEFF4

  app_options:
    com.apple.Terminal:
      ascii_mode: true
    org.electerm.electerm:
      ascii_mode: true
    com.jetbrains.pycharm:
      ascii_mode: true
    com.apple.SecurityAgent:
      ascii_mode: true
    com.apple.authorizationhost:
      ascii_mode: true
