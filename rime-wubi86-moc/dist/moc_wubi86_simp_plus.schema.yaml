# Rime schema
# encoding: utf-8
# Generated by work/build_moc_wubi86.py. Do not edit by hand.

schema:
  schema_id: moc_wubi86_simp_plus
  name: "moc 极点86五笔-全功能"
  version: "2026-06-29"
  author:
    - "moc local package, from pinned upstream sources"
  description: |
    core + 白霜词组 + 英文混输，简体，不学习（丰富全功能）。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, En ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]
  - name: ascii_punct
    reset: 0
    states: [ 。，, ．， ]

ascii_composer:
  good_old_caps_lock: true   # CapsLock 仅切换大小写（不主动切中英）；中英切换交给 Caps_Lock
  switch_key:
    Caps_Lock: clear          # CapsLock 按下：清空当前编码 + 切英文，大写字母直接上屏（同 frost 上游）
    Shift_L: commit_text      # 左 Shift：提交候选 + 切中英
    Shift_R: commit_text      # 右 Shift：提交候选 + 切中英
    Control_L: noop
    Control_R: noop

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - lua_processor@*moc_clear_empty
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - reverse_lookup_translator
    - lua_translator@*moc_date_time
    - lua_translator@*moc_calculator
    - lua_translator@*number_translator
    - lua_translator@*chineseLunarCalendar_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ/;.
  initials: zyxwvutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ/
  delimiter: " '"
  max_code_length: 32
  auto_clear: max_length

translator:
  dictionary: moc_wubi86_simp_plus
  initial_quality: 1.2
  enable_charset_filter: true
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  encode_commit_history: false

reverse_lookup:
  dictionary: moc_reverse
  prefix: "`"
  tips: "〔拼音反查〕"
  enable_completion: true

punctuator:
  import_preset: default
  symbols:
    "/fh": [ "，", "。", "、", "；", "：", "？", "！", "《》", "（）", "【】" ]

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "^`[a-z]*'?$"
    date: "^/(rq|sj)$"
    calculator: "^/calc[-+*/().0-9]+$"
    rmb: "^R[0-9]+[.]?[0-9]*$"
    gregorian_to_lunar: "^N[0-9]{1,8}$"
    punct: "^/fh$"

key_binder:
  import_preset: default

menu:
  page_size: 6
